    // ===== EXPORT / IMPORT =====
    function exportData() {
      const fileName = `gigtrack-backup.json`;
      const jsonStr = JSON.stringify({ version: 3, gigs, exported: new Date().toISOString() }, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });

      if (navigator.share) {
        const file = new File([blob], fileName, { type: 'application/json' });
        navigator.share({ files: [file], title: 'GigTrack Yedek' })
          .then(() => showToast('⬆ Paylaşıldı'))
          .catch(() => {
            const url = URL.createObjectURL(blob);
            navigator.share({ title: 'GigTrack Yedek', url })
              .catch(() => { triggerDownload(blob, fileName); });
          });
      } else {
        triggerDownload(blob, fileName);
      }
    }

    function triggerDownload(blob, fileName) {
      const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: fileName });
      a.click(); URL.revokeObjectURL(a.href);
      showToast('⬆ Veriler dışa aktarıldı');
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const raw = JSON.parse(ev.target.result);
          let imported = [];

          function findList(obj) {
            if (Array.isArray(obj)) return obj;
            if (typeof obj !== 'object' || obj === null) return null;
            let longest = null;
            for (let key in obj) {
              const val = obj[key];
              if (Array.isArray(val)) {
                if (!longest || val.length > longest.length) longest = val;
              } else if (typeof val === 'object') {
                const sub = findList(val);
                if (sub && (!longest || sub.length > longest.length)) longest = sub;
              }
            }
            return longest;
          }

          imported = findList(raw);

          if (!imported || imported.length === 0) {
            showToast('⚠️ Geçerli bir iş listesi bulunamadı.');
            return;
          }

          showConfirm('Verileri İçe Aktar',
            `${imported.length} kayıt incelenecek. Mevcut işlerinle çakışanlar atlanacak.`,
            () => {
              pushHistory();
              const fingerprint = g => `${g.date || ''}|${(g.venue || '').trim().toLowerCase()}|${(g.artist || '').trim().toLowerCase()}`;
              const existingFprints = new Set(gigs.map(fingerprint));
              const existingIds = new Set(gigs.map(g => g.id));

              let addedCount = 0;
              let skippedCount = 0;
              let firstItemSample = null;

              imported.forEach((item, idx) => {
                if (idx === 0) firstItemSample = item;

                // ULTRA ESNEK TARİH BULUCU (YYYY-MM-DD, DD.MM.YYYY, DD/MM/YYYY)
                let gDate = item.date || item.tarih || item.Date || item.gigDate || item.time || item.day || item.start;

                if (!gDate) {
                  for (let key in item) {
                    const val = item[key];
                    if (typeof val === 'string') {
                      // YYYY-MM-DD
                      if (/^\d{4}-\d{2}-\d{2}/.test(val)) { gDate = val.substring(0, 10); break; }
                      // DD.MM.YYYY veya DD/MM/YYYY
                      const m = val.match(/^(\d{2})[./](\d{2})[./](\d{4})/);
                      if (m) { gDate = `${m[3]}-${m[2]}-${m[1]}`; break; }
                    }
                  }
                }

                if (!gDate) { skippedCount++; return; }

                const normalized = {
                  id: item.id || uid(),
                  date: gDate,
                  venue: item.venue || item.mekan || item.Venue || item.place || item.title || item.location || "",
                  artist: item.artist || item.sanatci || item.Artist || item.group || item.name || "",
                  fee: item.fee || item.ucret || item.Fee || item.price || item.amount || "",
                  paid: !!(item.paid || item.odendi || item.Paid || item.isPaid || item.status === 'paid'),
                  currency: item.currency || item.birim || item.Currency || "TRY",
                  notes: item.notes || item.notlar || item.Notes || item.desc || item.info || "",
                  expenseAmount: item.expenseAmount || item.masraf || 0,
                  parentId: item.parentId || null
                };

                const f = fingerprint(normalized);
                if (!existingFprints.has(f) && !existingIds.has(normalized.id)) {
                  gigs.push(normalized);
                  addedCount++;
                  existingFprints.add(f);
                  existingIds.add(normalized.id);
                } else {
                  skippedCount++;
                }
              });

              save(); render();
              if (addedCount > 0) {
                showToast(`✓ ${addedCount} iş eklendi!`);
                const lastYear = gigs[gigs.length - 1].date.split('-')[0];
                if (lastYear !== activeYear) {
                  setTimeout(() => showToast(`ℹ️ İşler ${lastYear} yılına ait. Ayarlardan o yıla geçebilirsin.`), 1500);
                }
              } else {
                // TANI MODALI (Kullanıcıya içeriği göster)
                const sample = JSON.stringify(firstItemSample, null, 2);
                showConfirm('Veri Yapısı Tanınamadı',
                  `Dosyadaki 22 kayıt "iş" olarak tanınamadı. Dosyadaki ilk kaydın içeriği aşağıdadır. Lütfen bunu kopyalayıp asistana iletin:\n\n${sample}`,
                  () => { });
              }
            }
          );
        } catch (e) {
          showToast('⚠️ Dosya okunamadı veya formatı bozuk.');
          console.error(e);
        }
        e.target.value = '';
      };
      reader.readAsText(file);
    }

    // ===== CONFIRM =====
    function showConfirm(title, text, cb) {
      document.getElementById('confirmTitle').textContent = title;
      document.getElementById('confirmText').textContent = text;
      document.getElementById('confirmOkBtn').textContent = title.toLowerCase().includes('sil') ? 'Evet, Sil' : 'Devam Et';
      confirmCallback = cb;
      document.getElementById('confirmOverlay').classList.add('open');
      history.pushState({ modal: 'confirm' }, '', '#confirm');
    }
    function closeConfirm() {
      document.getElementById('confirmOverlay').classList.remove('open');
      confirmCallback = null;
      if (window.location.hash === '#confirm') history.back();
    }
    document.getElementById('confirmOkBtn').onclick = () => { if (confirmCallback) confirmCallback(); closeConfirm(); };
    document.getElementById('confirmOverlay').addEventListener('click', e => {
      if (e.target === document.getElementById('confirmOverlay')) closeConfirm();
    });

    // ===== TOAST =====
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2600);
    }

    // ===== CALCULATOR =====
    let calcExp = '';
    function openCalcModal() {
      calcExp = '';
      document.getElementById('calcDisplay').innerText = '0';
      document.getElementById('calcModalOverlay').classList.add('open');
      history.pushState({ modal: 'calc' }, '', '#calc');
      setTimeout(() => {
        document.getElementById('calcModalBox').style.opacity = '1';
        document.getElementById('calcModalBox').style.transform = 'translateY(0) scale(1)';
      }, 10);
    }
    function closeCalcModal() {
      document.getElementById('calcModalBox').style.opacity = '0';
      document.getElementById('calcModalBox').style.transform = 'translateY(-20px) scale(0.95)';
      setTimeout(() => { document.getElementById('calcModalOverlay').classList.remove('open'); }, 250);
      if (window.location.hash === '#calc') history.back();
    }
    function handleCalcOverlayClick(e) {
      if (e.target === document.getElementById('calcModalOverlay')) closeCalcModal();
    }
    function calcInput(k) {
      if (k === 'C') { calcExp = ''; }
      else if (k === '⌫') {
        calcExp = calcExp.slice(0, -1);
      }
      else if (k === '%') {
        calcExp += '%';
      }
      else if (k === '=') {
        try {
          let safeExp = calcExp
            .replace(/×/g, '*')
            .replace(/÷/g, '/');
          safeExp = safeExp.replace(/(\d+\.?\d*)([+\-*\/])(\d+\.?\d*)%/g, (m, a, op, b) => {
            if (op === '+' || op === '-') return `${a}${op}(${a}*${b}/100)`;
            return `${a}${op}(${b}/100)`;
          });
          safeExp = safeExp.replace(/(\d+\.?\d*)%/g, '($1/100)');
          const result = Function('"use strict"; return (' + safeExp + ')')();
          calcExp = parseFloat(result.toFixed(10)).toString();
        } catch { calcExp = 'Hata'; }
      }
      else if (k === '*' || k === '/') {
        calcExp += k === '*' ? '×' : '÷';
      }
      else {
        if (calcExp === '0' || calcExp === 'Hata') calcExp = '';
        calcExp += k;
      }
      document.getElementById('calcDisplay').innerText = calcExp || '0';
    }

    // ===== HARDWARE BACK BUTTON =====
    window.addEventListener('popstate', () => {
      const hash = window.location.hash;
      if (hash !== '#calc') {
        const cmo = document.getElementById('calcModalOverlay');
        if (cmo && cmo.classList.contains('open')) {
          document.getElementById('calcModalBox').style.opacity = '0';
          document.getElementById('calcModalBox').style.transform = 'translateY(-20px) scale(0.95)';
          setTimeout(() => { cmo.classList.remove('open'); }, 250);
        }
      }
      if (hash !== '#calendar') {
        document.getElementById('calendarModalOverlay').classList.remove('open');
      }
      if (hash !== '#settings') {
        document.getElementById('settingsOverlay').classList.remove('open');
      }
      if (hash !== '#modal' && hash !== '#calc' && hash !== '#calendar' && hash !== '#filter' && hash !== '#settings') {
        document.getElementById('modalOverlay').classList.remove('open');
      }
      if (hash !== '#confirm') {
        document.getElementById('confirmOverlay').classList.remove('open');
      }
    });

    // ===== INIT =====
    load();

    // ===== SETTINGS =====
    function openSettings() {
      const overlay = document.getElementById('settingsOverlay');
      const body = document.getElementById('settingsBody');
      if (!overlay || !body) return;

      const curYear = new Date().getFullYear().toString();
      const safeManualYears = Array.isArray(manualYears) ? manualYears : [];
      const safeGigs = Array.isArray(gigs) ? gigs : [];

      let years = [...new Set([curYear, ...safeManualYears, ...safeGigs.map(g => (g.date || '').split('-')[0])])];
      years = years.filter(y => y && y.length === 4).sort().reverse();

      body.innerHTML = `
    <div style="margin-bottom: 24px;">
      <div class="section-label" style="margin-top:0;">${T.archiveTitle}</div>
      <div style="font-size:12px; color:var(--text-3); margin-bottom:12px;">${T.archiveHint}</div>
      
      <div style="display:flex; gap:8px; margin-bottom:20px;">
        <input type="number" id="newYearInput" placeholder="Yıl (Örn: 2027)" onkeydown="if(event.key==='Enter') addManualYear()" style="flex:1; background:var(--surface-2); border:1px solid var(--border); padding:12px 16px; border-radius:12px; color:var(--text); font-size:15px; outline:none;">
        <button onclick="addManualYear()" style="background:var(--accent); color:#000; border:none; padding:0 20px; border-radius:12px; font-weight:700; font-size:20px;">+</button>
      </div>

      ${years.map(y => {
        const isActive = activeYear === y;
        const yearGigs = safeGigs.filter(g => (g.date || '').startsWith(y));
        const sums = {};
        yearGigs.forEach(g => {
          if (g.paid) {
            const f = parseFee(g.fee);
            if (f !== null) {
              const c = g.currency || 'TRY';
              sums[c] = (sums[c] || 0) + (f - (parseFloat(g.expenseAmount) || 0));
            }
          }
        });
        const incomeStr = Object.keys(sums).map(c => `${SYM[c] || ''}${sums[c].toLocaleString('tr')}`).join(' · ');

        return `
          <div class="filter-list-item" onclick="setActiveYear('${y}')" style="background:${isActive ? 'rgba(255,179,0,0.1)' : 'var(--surface-2)'}; border:1px solid ${isActive ? 'var(--accent)' : 'var(--border)'}; margin-bottom:10px; padding:14px 16px; border-radius:16px;">
            <div style="display:flex; flex-direction:column; gap:4px;">
              <span style="font-size:18px; font-weight:800; color:${isActive ? 'var(--accent)' : 'var(--text-3)'}">${y}</span>
              <div style="display:flex; align-items:center; gap:8px;">
                <span style="font-size:11px; color:var(--text-3); font-weight:500;">${yearGigs.length} iş</span>
                ${incomeStr ? `<span style="font-size:11px; color:var(--green); font-family:'DM Mono',monospace; font-weight:700;">${incomeStr}</span>` : ''}
              </div>
            </div>
            <div class="status-badge ${isActive ? 'paid' : 'unpaid'}" style="margin:0; padding:6px 12px; border-radius:12px;">
              ${isActive ? 'Görüntüleniyor' : 'Seç'}
            </div>
          </div>
        `;
      }).join('')}
    </div>

    <!-- DANGER ZONE -->
    <div style="margin-top: 40px; padding-top: 20px; border-top: 1px solid rgba(255,69,58,0.2);">
      <div class="section-label" style="color: #FF453A; margin-bottom: 8px;">${T.dangerZone}</div>
      <div style="font-size:12px; color:var(--text-3); margin-bottom:16px;">Tüm işlerin, ayarların ve geçmişin kalıcı olarak silinir.</div>
      <button onclick="resetAllData()" style="width:100%; background:rgba(255,69,58,0.1); color:#FF453A; border:1px solid rgba(255,69,58,0.3); padding:14px; border-radius:12px; font-weight:700; font-size:14px; cursor:pointer;">
        ${T.btnResetAll}
      </button>
    </div>
  `;
      overlay.classList.add('open');
      history.pushState({ modal: 'settings' }, '', '#settings');
    }

    function resetAllData() {
      showConfirm(T.resetConfirmTitle, T.resetConfirmText, () => {
        localStorage.clear();
        showToast(T.toastReset);
        // Kullanıcının sıfırlandığını görmesi için kısa bir gecikme ile yenile
        setTimeout(() => {
          location.reload();
        }, 800);
      });
    }

    function closeSettings() {
      document.getElementById('settingsOverlay').classList.remove('open');
      if (window.location.hash === '#settings') history.back();
    }

    function setActiveYear(y) {
      activeYear = y;
      save();
      render();
      closeSettings();
    }

    function addManualYear() {
      const inp = document.getElementById('newYearInput');
      if (!inp) return;
      const y = inp.value.trim();

      if (!y || isNaN(y) || y.length !== 4) {
        showToast('⚠️ Geçerli bir yıl girin (Örn: 2027)');
        return;
      }

      const curYear = new Date().getFullYear().toString();
      const safeManualYears = Array.isArray(manualYears) ? manualYears : [];
      const safeGigs = Array.isArray(gigs) ? gigs : [];

      const allExisting = new Set([
        curYear,
        ...safeManualYears,
        ...safeGigs.map(g => (g.date || '').split('-')[0])
      ]);

      if (allExisting.has(y)) {
        showToast('⚠️ Bu yıl zaten listede var');
      } else {
        if (!Array.isArray(manualYears)) manualYears = [];
        manualYears.push(y);
        save();
        openSettings();
        showToast(`✓ ${y} yılı eklendi`);
      }
      inp.value = '';
    }

    function confirmResetAll() {
      showConfirm(T.resetConfirmTitle, T.resetConfirmText, () => {
        localStorage.clear();
        location.reload();
      });
    }

    // ===== PWA SERVICE WORKER =====
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          console.log('SW registered!', reg);
        }).catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
</body>
